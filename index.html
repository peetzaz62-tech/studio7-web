    <script>
      // หน้าโหลดแสดงเฉพาะการเข้าเว็บครั้งแรก (และอีกครั้งเมื่อห่างไปเกิน 30 วัน)
      try { var t = +localStorage.getItem('s7-intro'); document.documentElement.classList.add((t && Date.now() - t < 2592e6) || /[?&]preview=/.test(location.search) ? 'no-intro' : 'boot-lock') } catch (e) { document.documentElement.classList.add('no-intro') }
    </script>
    <style>
      html.boot-lock { overflow: hidden; }
      html.no-intro #boot { display: none; }
      #boot {
        --paper: #f3f3f0; --ink: #121212; --pencil: #9b9b95;
        position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 30px;
        background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
        clip-path: inset(0 0 0 0); transition: clip-path 1s cubic-bezier(.76, 0, .24, 1), visibility 0s 1s;
        animation: boot-failsafe 0s 8s forwards;
      }
      #boot.done { clip-path: inset(0 0 100% 0); visibility: hidden; }
      .boot-sheet { width: min(64vw, 300px); }
      .boot-sheet svg { width: 100%; height: auto; display: block; overflow: visible; }
      .boot-guides line { stroke: var(--pencil); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw .7s cubic-bezier(.65, 0, .35, 1) forwards; }
      .boot-guides line:nth-child(2) { animation-delay: .1s; } .boot-guides line:nth-child(3) { animation-delay: .2s; } .boot-guides line:nth-child(4) { animation-delay: .3s; }
      .boot-guides { animation: boot-fade-out .6s 1.9s forwards; }
      .boot-ink path { fill: none; stroke: var(--ink); stroke-width: 2.4; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw 1.1s .35s cubic-bezier(.65, 0, .35, 1) forwards; }
      .boot-ink path + path { animation-delay: .6s; }
      .boot-hatch { opacity: 0; animation: boot-fade-in .4s 1.2s forwards; }
      .boot-hatch line { stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
      .boot-poche { transform: translateY(560px); animation: boot-rise .8s 1.55s cubic-bezier(.55, 0, .25, 1) forwards; fill: var(--ink); }
      .boot-name { margin: 0; display: grid; justify-items: center; gap: 6px; text-align: center; opacity: 0; animation: boot-fade-in .6s .6s forwards; }
      .boot-name b { font-family: 'Archivo', system-ui, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 13px; letter-spacing: .28em; text-transform: uppercase; }
      .boot-name span { font-size: 12px; color: #6b6b66; letter-spacing: .04em; }
      .boot-scale { display: grid; gap: 4px; justify-items: stretch; width: 150px; opacity: 0; animation: boot-fade-in .4s .3s forwards; }
      .boot-scale-bar { display: grid; grid-template-columns: 1fr 1fr 2fr 3fr; height: 6px; border: 1px solid var(--ink); }
      .boot-scale-bar i { background: var(--ink); transform: scaleX(0); transform-origin: left; animation: boot-grow .35s forwards; }
      .boot-scale-bar i:nth-child(1) { animation-delay: .5s; } .boot-scale-bar i:nth-child(2) { animation-delay: .95s; } .boot-scale-bar i:nth-child(3) { animation-delay: 1.4s; } .boot-scale-bar i:nth-child(4) { animation-delay: 1.85s; }
      .boot-scale-bar i:nth-child(even) { background: var(--paper); box-shadow: inset 0 0 0 1px var(--ink); }
      .boot-scale-num { display: grid; grid-template-columns: 1fr 1fr 2fr 3fr auto; font: 10px/1 'IBM Plex Mono', ui-monospace, monospace; color: #555; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-rise { to { transform: translateY(0); } }
      @keyframes boot-grow { to { transform: scaleX(1); } }
      @keyframes boot-fade-in { to { opacity: 1; } }
      @keyframes boot-fade-out { to { opacity: 0; } }
      @keyframes boot-failsafe { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: opacity .3s, visibility 0s .3s; } #boot.done { clip-path: none; opacity: 0; }
        #boot *, #boot { animation-duration: .01ms !important; animation-delay: 0s !important; }
      }
    </style>
