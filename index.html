    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html.boot-lock { overflow: hidden; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 28px;
        background: #000; color: #f4f6f7; font-family: 'IBM Plex Mono', ui-monospace, monospace;
        transition: clip-path .9s cubic-bezier(.76, 0, .24, 1), visibility 0s .9s;
        clip-path: inset(0 0 0 0);
        animation: boot-failsafe 0s 7s forwards;
      }
      #boot.done { clip-path: inset(0 0 100% 0); visibility: hidden; }
      .boot-mark { width: min(34vw, 150px); }
      .boot-mark svg { width: 100%; height: auto; display: block; overflow: visible; }
      .boot-outline path { fill: none; stroke: #00ffff; stroke-width: 6; stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw .9s cubic-bezier(.65, 0, .35, 1) forwards, boot-outline-out .5s 1.5s forwards; }
      .boot-outline path + path { animation-delay: .25s, 1.5s; }
      .boot-water { transform: translateY(560px); animation: boot-rise 1.1s .55s cubic-bezier(.55, 0, .25, 1) forwards; }
      .boot-wave { fill: #f4f6f7; animation: boot-wave 1.6s linear infinite; }
      .boot-name { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; opacity: 0; animation: boot-fade .6s .5s forwards; }
      .boot-name span + span { color: #7d8a8f; letter-spacing: .24em; }
      .boot-gauge { width: 120px; height: 2px; background: #1d2427; overflow: hidden; }
      .boot-gauge i { display: block; height: 100%; background: #00ffff; transform-origin: left; transform: scaleX(0); animation: boot-gauge 1.6s cubic-bezier(.65, 0, .35, 1) forwards; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-outline-out { to { opacity: 0; } }
      @keyframes boot-rise { to { transform: translateY(-40px); } }
      @keyframes boot-wave { to { transform: translateX(300px); } }
      @keyframes boot-fade { to { opacity: 1; } }
      @keyframes boot-gauge { to { transform: scaleX(1); } }
      @keyframes boot-failsafe { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #boot { transition: opacity .3s, visibility 0s .3s; }
        #boot.done { clip-path: none; opacity: 0; }
        .boot-outline path { animation: none; stroke-dashoffset: 0; opacity: 0; }
        .boot-water { animation: none; transform: translateY(-40px); }
        .boot-wave, .boot-gauge i { animation: none; }
        .boot-name { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
